<!DOCTYPE html>
<html>
<head>
  <title>Character Randomizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="/race-randomizer/">Track</a>
    <b><a href="#">Character</a></b>
  </header>
  <h1>Character Randomizer</h1>

  <label>
    ⭐ 3★ Characters:

  <h2>Results</h2>
  <div id="results"></div>

  <script src="script.js"></script>
</body>
</html>
